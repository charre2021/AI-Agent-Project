[project]
name = "aiagent"
version = "0.1.0"
description = "AI Agent that performs Wikipedia research."
authors = [
    {name = "Chris Harrelson"}
]
packages = "aiagent"
requires-python = ">=3.13,<4.0.0"
dependencies = [
    "langchain (>=1.2.8,<2.0.0)",
    "wikipedia (>=1.4.0,<2.0.0)",
    "langchain-community (>=0.4.1,<0.5.0)",
    "langchain-openai (>=1.1.7,<2.0.0)",
    "langchain-anthropic (>=1.3.1,<2.0.0) ; python_version >= '3.13' and python_version < '4.0.0'",
    "pydantic (>=2.12.5,<3.0.0)",
    "python-dotenv (>=1.2.1,<2.0.0)",
    "ddgs (>=9.10.0,<10.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
